# Reusable secure-delivery workflow for container images.
#
#   secrets ─┐
#   sast    ─┼─> build ─> SBOM ─> image scan ─> smoke test ─> push ─> sign ─> attest SBOM
#   trivy-fs┘
#
# Images pushed from this workflow are signed keylessly with Sigstore. The signing certificate
# identity is this workflow file, so admission policies can require "built by the central pipeline".
name: secure-container

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      artifact-name:
        description: Optional build artifact (from an earlier job in the caller) to download into the context
        type: string
        default: ""
      smoke-command:
        description: Optional shell command run against the built image; $IMAGE holds the local tag
        type: string
        default: ""
      push:
        description: Push, sign and attest (set true only for trusted refs, e.g. main)
        type: boolean
        default: false
      severity:
        type: string
        default: CRITICAL,HIGH
      semgrep-config:
        type: string
        default: p/default
    outputs:
      image:
        description: Pushed image reference pinned by digest (empty when push is false)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.185.0"

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git --redact --verbose --exit-code 1 .

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep
        # Findings are printed in the log (text) and uploaded to code scanning (SARIF).
        run: semgrep scan --config "${{ inputs.semgrep-config }}" --metrics=off --error --text --sarif-output=semgrep.sarif .
      - name: Upload to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true   # code scanning may be unavailable on some repositories

  trivy-fs:
    name: Dependencies, IaC and secrets (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.context }}
          scanners: vuln,misconfig,secret
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build, scan, sign
    needs: [secrets, sast, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # Sigstore keyless signing
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      LOCAL_IMAGE: local/${{ inputs.image-name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.context }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Vulnerability gate (Trivy image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test
        if: inputs.smoke-command != ''
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
        run: ${{ inputs.smoke-command }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.image-name }}
          path: sbom.spdx.json

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: publish
        if: inputs.push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image-name }}"
          docker tag "$LOCAL_IMAGE" "$repo:${GITHUB_SHA}"
          docker push "$repo:${GITHUB_SHA}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:${GITHUB_SHA}" | cut -d@ -f2)
          echo "image=$repo@$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.push
      - name: Sign (keyless) and attest SBOM
        if: inputs.push
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          {
            echo "### Secure delivery: \`${{ inputs.image-name }}\`"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Secret scan · SAST · Trivy fs | passed (required) |"
            echo "| SBOM (SPDX) | generated |"
            echo "| Image vulnerabilities (${{ inputs.severity }}, fixable) | passed |"
            if [ -n "$IMAGE" ]; then
              echo "| Published | \`$IMAGE\` |"
              echo "| Signature + SBOM attestation | Sigstore keyless |"
            else
              echo "| Published | not pushed (push=false) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
