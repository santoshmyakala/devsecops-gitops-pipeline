name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_VERSION: v1.20.0

jobs:
  lint:
    name: Workflows, scripts, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .

  policy-tests:
    name: Kyverno policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Kyverno CLI
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          sudo mv kyverno /usr/local/bin/
      - run: kyverno test policies/tests

  render-and-conform:
    name: Render wine-quality chart per environment and check policy conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: santoshmyakala/wine-quality-mlops
          path: _app
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install Kyverno CLI and kubeconform
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: Render dev and prod exactly as Argo CD would
        run: |
          for env in dev prod; do
            helm template wine _app/deploy/helm/wine-quality-api \
              -f "gitops/environments/$env/wine-quality-api.yaml" -n "wine-$env" > "rendered-$env.yaml"
          done
      - name: Kubernetes schema validation
        run: ./kubeconform -strict -summary rendered-*.yaml
      - name: Argo CD manifests schema validation
        run: |
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/argocd/
      - name: Rendered workloads satisfy every pod-security policy
        run: |
          policies=()
          for f in policies/kyverno/*.yaml; do
            [[ "$f" == *verify-image* ]] || policies+=("$f")   # signature checks need a registry; covered by e2e
          done
          for env in dev prod; do
            ./kyverno apply "${policies[@]}" --resource "rendered-$env.yaml"
          done

  e2e:
    name: Admission e2e on kind
    needs: [policy-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: e2e
      - name: Install Kyverno
        run: |
          kubectl apply --server-side -f "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=300s
      - name: Apply policies and wait until they are ready
        run: |
          # The webhook can lag behind the rollout; retry until it accepts the policies.
          for _ in $(seq 1 24); do kubectl apply -f policies/kyverno/ && break; sleep 5; done
          for _ in $(seq 1 60); do
            not_ready=$(kubectl get validatingpolicies,imagevalidatingpolicies -o json \
              | jq '[.items[] | select((.status.conditionStatus.ready // false) != true)] | length')
            [ "$not_ready" = "0" ] && break; sleep 5
          done
          kubectl get validatingpolicies,imagevalidatingpolicies
      - name: Admission decisions
        run: ./scripts/e2e-admission.sh
      - name: Kyverno logs on failure
        if: failure()
        run: kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=200
