apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers share the host kernel's capabilities and devices, so a container compromise becomes a node compromise.
spec:
  validationActions: [Deny]
  # Pods and workload controllers are matched explicitly, so Kyverno does not auto-generate controller rules.
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.?namespace.orValue('default') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'argocd', 'local-path-storage'])"
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
    - name: containers
      expression: "variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])"
  validations:
    - expression: "variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))"
      message: Privileged containers are not allowed.
