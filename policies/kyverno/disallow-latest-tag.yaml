apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow mutable or missing image tags
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images must be pinned by digest or an explicit tag other than latest, so what runs is what was scanned and approved.
spec:
  validationActions: [Deny]
  # Pods and workload controllers are matched explicitly, so Kyverno does not auto-generate controller rules.
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.?namespace.orValue('default') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'argocd', 'local-path-storage'])"
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
    - name: containers
      expression: "variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@') ||
          (c.image.matches(':[^/]+$') && !c.image.endsWith(':latest')))
      message: Images must use an explicit tag or a digest, never ':latest' or no tag.
