apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require CPU and memory requests and a memory limit
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Requests make scheduling predictable; a memory limit stops one workload starving the node.
spec:
  validationActions: [Deny]
  autogen:
    podControllers:
      enabled: false   # controllers are matched explicitly below
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.?namespace.orValue('default') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'argocd', 'local-path-storage'])"
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
    - name: containers
      expression: "variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.podSpec.containers.all(c,
          c.?resources.?requests.?cpu.hasValue() &&
          c.?resources.?requests.?memory.hasValue() &&
          c.?resources.?limits.?memory.hasValue())
      message: Every container needs cpu and memory requests and a memory limit.
