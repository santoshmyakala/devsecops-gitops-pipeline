# Compliant: mirrors what the wine-quality-api Helm chart renders.
apiVersion: apps/v1
kind: Deployment
metadata: { name: good-app, namespace: apps }
spec:
  selector: { matchLabels: { app: good } }
  template:
    metadata: { labels: { app: good } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: ghcr.io/example/api:1.0.0
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 } }
          readinessProbe: { httpGet: { path: /readyz, port: 8000 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bad-privileged, namespace: apps }
spec:
  selector: { matchLabels: { app: bad1 } }
  template:
    metadata: { labels: { app: bad1 } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: ghcr.io/example/api:1.0.0
          securityContext: { privileged: true, allowPrivilegeEscalation: false }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bad-root-latest-noprobes, namespace: apps }
spec:
  selector: { matchLabels: { app: bad2 } }
  template:
    metadata: { labels: { app: bad2 } }
    spec:
      containers:
        - name: api
          image: nginx:latest
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: bad-no-resources-untagged, namespace: apps }
spec:
  securityContext: { runAsNonRoot: true }
  containers:
    - name: api
      image: nginx
      securityContext: { allowPrivilegeEscalation: false }
